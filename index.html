<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>StudyPro Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="index-ByCQSxev.css">
  <style>
    /* ─── Animations ────────────────────────────────────────────────── */
    @keyframes overlayFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes vPulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%     { opacity:.3; transform:scale(.65); }
    }

    @keyframes userBarSlideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dashFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── Auth Overlay ──────────────────────────────────────────────── */
    #auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      animation: overlayFadeIn 0.25s ease;
    }

    .auth-card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px 40px;
      text-align: center;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
    }

    .auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .auth-title {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 8px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 32px;
      line-height: 1.5;
    }

    .auth-card button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .auth-card button:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .auth-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-error {
      margin-top: 14px;
      font-size: 13px;
      color: #ef4444;
      min-height: 18px;
      text-align: center;
    }

    /* ─── Auth email form ────────────────────────────────────────────── */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .auth-input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 10px;
      display: block;
    }
    .auth-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background: #fff;
    }
    .auth-input::placeholder { color: #94a3b8; }

    .auth-btn-primary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #3b82f6 !important;
      border: 2px solid #3b82f6 !important;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #fff !important;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      margin-bottom: 8px;
    }
    .auth-btn-primary:hover:not(:disabled) {
      background: #2563eb !important;
      border-color: #2563eb !important;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
    .auth-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-btn-outline {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border: 2px solid #e2e8f0 !important;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #334155 !important;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .auth-btn-outline:hover:not(:disabled) {
      background: #f1f5f9 !important;
      border-color: #3b82f6 !important;
    }
    .auth-btn-outline:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-card .auth-forgot {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      color: #3b82f6;
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      width: 100%;
      text-align: center;
      text-decoration: underline;
      padding: 4px 0;
    }
    .auth-card .auth-forgot:hover { color: #2563eb; background: none !important; }
    .auth-success {
      margin-top: 10px;
      font-size: 13px;
      color: #10b981;
      min-height: 18px;
      text-align: center;
    }

    /* ─── User Bar ──────────────────────────────────────────────────── */
    #user-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 20px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e2e8f0;
      font-family: 'Inter', sans-serif;
    }

    /* Brand logo inside the user bar */
    .sp-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #1e40af;
      letter-spacing: -0.2px;
      user-select: none;
      text-decoration: none;
    }

    .sp-brand-icon {
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
    }

    .sp-brand-full { display: inline; }
    .sp-brand-short { display: none; }

    @media (max-width: 480px) {
      .sp-brand-full  { display: none; }
      .sp-brand-short { display: inline; }
      #user-bar { padding: 6px 12px; }
    }

    .sp-brand-sub {
      font-weight: 400;
      color: #475569;
      font-size: 13px;
    }

    html.sp-dark .sp-brand { color: #93c5fd; }
    html.sp-dark .sp-brand-sub { color: #94a3b8; }

    /* Trigger button */
    .ud-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1.5px solid transparent;
      border-radius: 10px;
      padding: 5px 10px 5px 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: 'Inter', sans-serif;
    }

    .ud-trigger:hover {
      background: #f1f5f9;
      border-color: #e2e8f0;
    }

    .ud-trigger-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3b82f6;
      flex-shrink: 0;
    }

    .ud-trigger-name {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .ud-caret {
      color: #94a3b8;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .ud-trigger[aria-expanded="true"] .ud-caret {
      transform: rotate(180deg);
    }

    /* Dropdown menu */
    .ud-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 12px;
      width: 240px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 6px 0;
      opacity: 0;
      transform: translateY(-6px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      z-index: 10000;
    }

    .ud-menu.ud-open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .ud-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px 10px;
    }

    .ud-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3b82f6;
      flex-shrink: 0;
    }

    .ud-name {
      font-weight: 600;
      color: #0f172a;
      font-size: 13px;
    }

    .ud-email {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
      word-break: break-all;
    }

    .ud-divider {
      height: 1px;
      background: #f1f5f9;
      margin: 4px 0;
    }

    .ud-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      font-size: 12px;
      color: #64748b;
    }

    .ud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
    }

    .ud-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      background: transparent;
      border: none;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s;
      font-family: 'Inter', sans-serif;
    }

    .ud-item:hover {
      background: #f8fafc;
    }

    .ud-item--danger {
      color: #ef4444;
    }

    .ud-item--danger:hover {
      background: #fef2f2;
    }

    .ud-item:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #root {
      padding-top: 44px;
    }

    /* ─── Dark mode ──────────────────────────────────────────────────── */
    html.sp-dark body {
      background: #0f172a;
    }

    html.sp-dark #user-bar {
      background: rgba(15, 23, 42, 0.95);
      border-bottom-color: #1e293b;
    }

    html.sp-dark .ud-trigger:hover {
      background: #1e293b;
      border-color: #334155;
    }

    html.sp-dark .ud-trigger-name {
      color: #e2e8f0;
    }

    html.sp-dark .ud-caret {
      color: #64748b;
    }

    html.sp-dark .ud-menu {
      background: #1e293b;
      border-color: #334155;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    html.sp-dark .ud-name {
      color: #f1f5f9;
    }

    html.sp-dark .ud-email {
      color: #64748b;
    }

    html.sp-dark .ud-divider {
      background: #334155;
    }

    html.sp-dark .ud-status {
      color: #94a3b8;
    }

    html.sp-dark .ud-item {
      color: #cbd5e1;
    }

    html.sp-dark .ud-item:hover {
      background: #334155;
    }

    html.sp-dark .ud-item--danger {
      color: #f87171;
    }

    html.sp-dark .ud-item--danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    html.sp-dark #sp-skeleton {
      background: #0f172a;
    }

    html.sp-dark .sk-pulse {
      background: #1e293b;
    }

    html.sp-dark .sk-card {
      background: #1e293b;
    }

    html.sp-dark .sk-bottomnav {
      background: #0f172a;
      border-top-color: #1e293b;
    }

    /* ─── Dropdown extras ───────────────────────────────────────────── */
    .ud-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: #3b82f6; color: #fff; border-radius: 10px;
      font-size: 10px; font-weight: 700; min-width: 18px; height: 18px;
      padding: 0 5px; margin-left: auto;
    }
    .ud-item--admin { color: #7c3aed; }
    .ud-item--admin:hover { background: #f5f3ff; }
    html.sp-dark .ud-item--admin { color: #a78bfa; }
    html.sp-dark .ud-item--admin:hover { background: rgba(124,58,237,0.15); }

    /* ─── Modal Panel ────────────────────────────────────────────────── */
    .sp-panel {
      position: fixed; inset: 0; z-index: 99998;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; transition: opacity 0.2s ease;
      font-family: 'Inter', sans-serif;
    }
    .sp-panel--open { opacity: 1; }
    .sp-panel-card {
      background: #fff; border-radius: 18px; width: 100%; max-width: 460px;
      max-height: 80vh; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
      transform: translateY(12px); transition: transform 0.22s ease;
    }
    .sp-panel--open .sp-panel-card { transform: translateY(0); }
    .sp-panel-card--wide { max-width: 620px; }
    .sp-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 14px; border-bottom: 1px solid #f1f5f9;
      flex-shrink: 0;  /* header never shrinks */
    }
    /* Admin content wrapper — scrollable for all tabs */
    #sp-admin-content {
      overflow-y: auto;
      max-height: calc(80vh - 106px); /* panel height minus header + tabs */
      overscroll-behavior: contain;
    }
    /* Rewards content wrapper */
    #sp-rewards-content {
      flex: 1; min-height: 0; overflow-y: auto;
    }
    .sp-panel-title { font-size: 17px; font-weight: 700; color: #0f172a; margin: 0; }
    .sp-panel-close {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: #f1f5f9; color: #64748b; font-size: 18px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .sp-panel-close:hover { background: #e2e8f0; }
    .sp-empty {
      text-align: center; color: #64748b; padding: 40px 20px;
      font-size: 14px; line-height: 1.6;
    }

    /* ─── Rewards grid ───────────────────────────────────────────────── */
    .sp-rewards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px; padding: 18px; overflow-y: auto;
    }
    .sp-reward-card {
      border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px 12px;
      text-align: center; background: #f8fafc; position: relative;
      transition: box-shadow 0.15s;
    }
    .sp-reward-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.09); }
    .sp-reward-emoji { font-size: 34px; margin-bottom: 8px; }
    .sp-reward-title { font-size: 12px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .sp-reward-desc  { font-size: 11px; color: #64748b; line-height: 1.4; }
    .sp-reward-badge {
      position: absolute; top: 8px; right: 8px;
      background: #7c3aed; color: #fff; font-size: 9px; font-weight: 700;
      border-radius: 6px; padding: 1px 5px; text-transform: uppercase;
    }

    /* ─── Admin panel ────────────────────────────────────────────────── */
    .sp-admin-bar {
      padding: 10px 18px 6px;
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0; /* always visible, never pushed out */
    }
    .sp-chip {
      display: inline-block; background: #f1f5f9; color: #64748b;
      border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 600;
    }
    .sp-user-list {
      padding: 10px 14px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .sp-user-card {
      border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px;
      background: #fafafa;
    }
    .sp-user-card-row {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px; margin-bottom: 10px;
    }
    .sp-user-card-name  { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
    .sp-user-card-email { font-size: 11px; color: #64748b; word-break: break-all; }
    .sp-user-chips { display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
    .sp-refresh-btn {
      margin-left: auto; background: #f1f5f9; border: 1px solid #e2e8f0;
      color: #475569; border-radius: 8px; padding: 4px 10px; font-size: 12px;
      font-weight: 600; cursor: pointer; transition: background 0.12s;
      font-family: 'Inter', sans-serif;
    }
    .sp-refresh-btn:hover { background: #e2e8f0; }
    .sp-user-info-col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .sp-rank { margin-right: 4px; }
    .sp-user-medals {
      display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px;
    }
    .sp-user-medals--empty { font-size: 11px; color: #cbd5e1; font-style: italic; }
    .sp-medal-pip {
      font-size: 16px; cursor: default; line-height: 1;
    }
    .sp-medal-btn {
      width: 100%; background: #eff6ff; border: 1.5px solid #bfdbfe;
      color: #2563eb; border-radius: 8px; padding: 7px; font-size: 12px;
      font-weight: 600; cursor: pointer; transition: background 0.12s;
      font-family: 'Inter', sans-serif;
    }
    .sp-medal-btn:hover { background: #dbeafe; }
    .sp-medal-form {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    .amd-option {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 5px 10px; font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.12s; font-family: 'Inter', sans-serif; color: #334155;
    }
    .amd-option:hover { background: #f0fdf4; border-color: #86efac; color: #166534; }
    .amd-option:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ─── Medal notification ─────────────────────────────────────────── */
    .medal-notif {
      position: fixed; bottom: 24px; right: 24px; z-index: 99999;
      display: flex; align-items: center; gap: 12px;
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 14px; padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.14);
      font-family: 'Inter', sans-serif;
      transform: translateX(calc(100% + 30px)); opacity: 0;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.3s ease;
      max-width: 260px;
    }
    .medal-notif--show { transform: translateX(0); opacity: 1; }
    .medal-notif-emoji { font-size: 32px; flex-shrink: 0; }
    .medal-notif-top   { font-size: 11px; color: #64748b; margin-bottom: 2px; font-weight: 500; }
    .medal-notif-name  { font-size: 14px; font-weight: 700; color: #0f172a; }

    /* ─── Dark mode — panels & admin ────────────────────────────────── */
    html.sp-dark .sp-panel-card { background: #1e293b; }
    html.sp-dark .sp-panel-header { border-bottom-color: #334155; }
    html.sp-dark .sp-panel-title { color: #f1f5f9; }
    html.sp-dark .sp-panel-close { background: #334155; color: #94a3b8; }
    html.sp-dark .sp-empty { color: #64748b; }
    html.sp-dark .sp-reward-card { background: #0f172a; border-color: #334155; }
    html.sp-dark .sp-reward-title { color: #f1f5f9; }
    html.sp-dark .sp-reward-desc  { color: #64748b; }
    html.sp-dark .sp-chip { background: #334155; color: #94a3b8; }
    html.sp-dark .sp-user-card { background: #0f172a; border-color: #334155; }
    html.sp-dark .sp-user-card-name  { color: #f1f5f9; }
    html.sp-dark .sp-user-card-email { color: #64748b; }
    html.sp-dark .sp-medal-btn { background: rgba(37,99,235,0.15); border-color: #1e40af; color: #93c5fd; }
    html.sp-dark .sp-refresh-btn { background: #334155; border-color: #475569; color: #94a3b8; }
    html.sp-dark .sp-user-medals--empty { color: #475569; }
    html.sp-dark .amd-option { background: #1e293b; border-color: #334155; color: #cbd5e1; }
    html.sp-dark .medal-notif { background: #1e293b; border-color: #334155; }
    html.sp-dark .medal-notif-name { color: #f1f5f9; }

    /* ─── Skeleton Loader ───────────────────────────────────────────── */
    @keyframes sk-pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .sk-pulse {
      background: #e2e8f0;
      border-radius: 8px;
      animation: sk-pulse 1.4s ease-in-out infinite;
    }

    #sp-skeleton {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: #f8fafc;
      padding: 48px 16px 80px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sk-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      margin-bottom: 4px;
    }

    .sk-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sk-body {
      flex: 1;
      display: flex;
      gap: 12px;
      min-height: 0;
    }

    .sk-col-main {
      flex: 1.5;
      display: flex;
      flex-direction: column;
    }

    .sk-col-side {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .sk-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .sk-bottomnav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 14px;
      gap: 0;
    }

    /* ─── Toast notifications ───────────────────────────────────────── */
    .sp-toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 99999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      max-width: 380px;
      animation: toast-in 0.25s ease;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sp-toast span {
      flex: 1;
      line-height: 1.4;
    }

    .sp-toast a {
      color: inherit;
      font-weight: 700;
    }

    .sp-toast button {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      opacity: 0.7;
      color: inherit;
    }

    .sp-toast--warn {
      background: #fff7ed;
      color: #92400e;
      border: 1.5px solid #fbbf24;
    }

    .sp-toast--error {
      background: #fef2f2;
      color: #991b1b;
      border: 1.5px solid #fca5a5;
    }

    .sp-toast--info {
      background: #eff6ff;
      color: #1e40af;
      border: 1.5px solid #93c5fd;
    }

    /* ── Inbox card (Dashboard / Stats tab) ─────────────────────── */
    .sp-inbox-empty {
      text-align: center; color: #64748b; padding: 20px 10px;
      font-size: 13.5px; line-height: 1.7;
    }
    .sp-inbox-list { display: flex; flex-direction: column; gap: 10px; }
    .sp-inbox-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: #ef4444; color: #fff; font-size: 11px; font-weight: 700;
      border-radius: 20px; padding: 2px 9px; margin-left: 4px;
    }
    .sp-inbox-msg {
      border-radius: 12px; padding: 12px 14px; font-family: 'Inter', sans-serif;
      transition: box-shadow 0.15s;
    }
    .sp-inbox-msg--unread {
      background: #eff6ff; border: 1.5px solid #bfdbfe;
    }
    html.sp-dark .sp-inbox-msg--unread { background: #1e3a5f; border-color: #3b82f6; }
    .sp-inbox-msg--read {
      background: #f8fafc; border: 1px solid #e2e8f0;
    }
    html.sp-dark .sp-inbox-msg--read { background: #0f172a; border-color: #334155; }
    .sp-inbox-msg-header {
      display: flex; align-items: center; gap: 7px;
      margin-bottom: 6px; flex-wrap: wrap;
    }
    .sp-inbox-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: #3b82f6;
    }
    .sp-inbox-dot--read { background: #cbd5e1; }
    .sp-inbox-author {
      font-size: 12px; font-weight: 700; color: #334155; flex: 1;
    }
    html.sp-dark .sp-inbox-author { color: #93c5fd; }
    .sp-inbox-time { font-size: 11px; color: #94a3b8; }
    .sp-inbox-msg-text {
      font-size: 13.5px; color: #1e293b; line-height: 1.5; margin-bottom: 8px;
    }
    html.sp-dark .sp-inbox-msg-text { color: #e2e8f0; }
    .sp-inbox-read-btn {
      display: inline-block; background: transparent;
      border: 1px solid #bfdbfe; color: #2563eb;
      border-radius: 6px; padding: 3px 10px; font-size: 11.5px; font-weight: 600;
      cursor: pointer; transition: background 0.12s;
      font-family: 'Inter', sans-serif;
    }
    .sp-inbox-read-btn:hover { background: #dbeafe; }
    .sp-inbox-read-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .sp-inbox-read-status { font-size: 11.5px; color: #94a3b8; }

    .sp-inbox-actions {
      display: flex; align-items: center; gap: 8px; margin-top: 6px;
    }
    .sp-inbox-del-btn {
      background: transparent; border: 1px solid #fca5a5;
      border-radius: 6px; padding: 3px 8px; font-size: 13px;
      cursor: pointer; transition: background 0.12s, border-color 0.12s;
      line-height: 1; color: #ef4444;
    }
    .sp-inbox-del-btn:hover { background: #fee2e2; border-color: #ef4444; }
    .sp-inbox-del-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    html.sp-dark .sp-inbox-del-btn { border-color: #7f1d1d; color: #fca5a5; }
    html.sp-dark .sp-inbox-del-btn:hover { background: #450a0a; }

    /* ── Admin msg history ───────────────────────────────────────── */
    .sp-hist-msg {
      border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px;
      background: #f8fafc; margin-bottom: 8px;
    }
    html.sp-dark .sp-hist-msg { background: #0f172a; border-color: #334155; }
    .sp-hist-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap;
    }
    .sp-hist-to {
      font-size: 12px; font-weight: 700; color: #334155; flex: 1;
    }
    html.sp-dark .sp-hist-to { color: #cbd5e1; }
    .sp-hist-time { font-size: 11px; color: #94a3b8; }
    .sp-hist-status { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 1px 7px; }
    .sp-hist-status--read   { background: #f0fdf4; color: #166534; }
    .sp-hist-status--unread { background: #fef2f2; color: #991b1b; }
    .sp-hist-text { font-size: 12.5px; color: #475569; line-height: 1.4; }
    html.sp-dark .sp-hist-text { color: #94a3b8; }

    /* ── Rewards section labels ───────────────────────────────────── */
    .sp-rewards-section { padding: 6px 0; }
    .sp-rewards-section-label {
      font-size: 12px; font-weight: 700; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 4px 18px 6px; display: block;
    }

    /* ── User bar inbox badge variant ────────────────────────────── */
    .ud-badge--msg { background: #ef4444; }

    /* ── Evolution tier card ─────────────────────────────────────── */
    .tier-card {
      background: var(--sp-card, #f8fafc);
      border: 1.5px solid var(--sp-border, #e2e8f0);
      border-radius: 14px;
      padding: 16px 18px 14px;
      margin-bottom: 14px;
    }
    html.sp-dark .tier-card {
      background: #1e293b;
      border-color: #334155;
    }
    .tier-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tier-emoji-big { font-size: 38px; line-height: 1; }
    .tier-info { flex: 1; }
    .tier-grade-name {
      font-weight: 700;
      font-size: 16px;
      color: var(--sp-text, #1e293b);
    }
    html.sp-dark .tier-grade-name { color: #f1f5f9; }
    .tier-time-label {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
    .tier-all {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tier-pip {
      font-size: 20px;
      opacity: 0.25;
      filter: grayscale(1);
      cursor: default;
      transition: opacity 0.2s, filter 0.2s;
    }
    .tier-pip--on {
      opacity: 1;
      filter: none;
    }
    .tier-bar-wrap {
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      margin-top: 12px;
      overflow: hidden;
    }
    html.sp-dark .tier-bar-wrap { background: #334155; }
    .tier-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s ease;
      min-width: 4px;
    }
    .tier-next-info {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }

    /* ── Blocking medal modal ────────────────────────────────────── */
    .sp-medal-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sp-medal-modal--show { opacity: 1; }
    .sp-medal-modal-card {
      background: #fff;
      border-radius: 22px;
      padding: 36px 32px 28px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    .sp-medal-modal--show .sp-medal-modal-card { transform: scale(1); }
    html.sp-dark .sp-medal-modal-card {
      background: #1e293b;
      color: #f1f5f9;
    }
    .sp-medal-modal-confetti { font-size: 28px; margin-bottom: 4px; }
    .sp-medal-modal-emoji { font-size: 72px; margin: 6px 0; }
    .sp-medal-modal-title {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .sp-medal-modal-name {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 6px;
    }
    html.sp-dark .sp-medal-modal-name { color: #f1f5f9; }
    .sp-medal-modal-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .sp-medal-modal-from {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .sp-medal-modal-btn {
      margin-top: 12px;
      padding: 12px 40px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .sp-medal-modal-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.35);
    }

    /* ── Admin notification banners ─────────────────────────────── */
    .sp-msg-banner {
      position: fixed;
      top: 52px;
      left: 0; right: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 500;
      transform: translateY(-100%);
      transition: transform 0.35s ease;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }
    .sp-msg-banner--show { transform: translateY(0); }
    .sp-msg-banner--global {
      background: #f0fdf4;
      color: #166534;
      border-bottom: 2px solid #86efac;
    }
    html.sp-dark .sp-msg-banner--global {
      background: #14532d;
      color: #bbf7d0;
      border-color: #16a34a;
    }
    .sp-msg-banner--private {
      background: #eff6ff;
      color: #1e40af;
      border-bottom: 2px solid #93c5fd;
    }
    html.sp-dark .sp-msg-banner--private {
      background: #1e3a5f;
      color: #bfdbfe;
      border-color: #3b82f6;
    }
    .sp-msg-icon { font-size: 18px; }
    .sp-msg-text { flex: 1; }
    .sp-msg-close {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: inherit;
      opacity: 0.6;
      line-height: 1;
      padding: 0 4px;
    }
    .sp-msg-close:hover { opacity: 1; }

    /* ── Admin panel tabs ────────────────────────────────────────── */
    .sp-admin-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 16px 0;
      border-bottom: 2px solid var(--sp-border, #e2e8f0);
      background: var(--sp-card, #f8fafc);
      flex-shrink: 0;
    }
    html.sp-dark .sp-admin-tabs {
      background: #1e293b;
      border-color: #334155;
    }
    .sp-tab {
      padding: 8px 16px;
      border: none;
      background: transparent;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      margin-bottom: -2px;
      border-bottom: 2px solid transparent;
    }
    .sp-tab:hover { background: #f1f5f9; color: #1e293b; }
    html.sp-dark .sp-tab:hover { background: #334155; color: #f1f5f9; }
    .sp-tab--active {
      color: #6366f1;
      border-bottom: 2px solid #6366f1;
      background: var(--sp-bg, #fff);
    }
    html.sp-dark .sp-tab--active {
      color: #818cf8;
      border-color: #818cf8;
      background: #0f172a;
    }

    /* ── Team management ─────────────────────────────────────────── */
    .sp-team-section {
      padding: 16px;
      border-bottom: 1px solid var(--sp-border, #e2e8f0);
    }
    html.sp-dark .sp-team-section { border-color: #334155; }
    .sp-team-section:last-child { border-bottom: none; }
    .sp-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 10px;
    }
    .sp-team-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .sp-team-input {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
      color: #1e293b;
      outline: none;
    }
    html.sp-dark .sp-team-input {
      background: #0f172a;
      border-color: #334155;
      color: #f1f5f9;
    }
    .sp-team-input:focus { border-color: #6366f1; }
    .sp-team-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .sp-team-btn:hover { opacity: 0.85; }
    .sp-team-btn--promote { background: #6366f1; color: #fff; }
    .sp-team-btn--remove  { background: #ef4444; color: #fff; }
    .sp-team-msg {
      font-size: 12.5px;
      margin-top: 8px;
      min-height: 16px;
      color: #64748b;
    }
    .sp-team-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }
    html.sp-dark .sp-team-row { border-color: #1e293b; }
    .sp-team-name { font-weight: 600; font-size: 13px; color: var(--sp-text, #1e293b); }
    html.sp-dark .sp-team-name { color: #f1f5f9; }
    .sp-team-email { font-size: 12px; color: #64748b; flex: 1; }
    .sp-team-action {
      padding: 5px 10px;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .sp-team-action:hover:not(:disabled) { opacity: 0.8; }
    .sp-team-action:disabled { opacity: 0.4; cursor: default; }
    .sp-team-action--remove  { background: #fee2e2; color: #b91c1c; }
    .sp-team-action--block   { background: #fef3c7; color: #92400e; }
    .sp-team-action--unblock { background: #dcfce7; color: #15803d; }
    .sp-empty-small {
      font-size: 13px;
      color: #94a3b8;
      padding: 6px 0;
    }

    /* ── Admin messaging ─────────────────────────────────────────── */
    .sp-msg-textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      background: #fff;
      color: #1e293b;
      outline: none;
      margin-top: 8px;
    }
    html.sp-dark .sp-msg-textarea {
      background: #0f172a;
      border-color: #334155;
      color: #f1f5f9;
    }
    .sp-msg-textarea:focus { border-color: #6366f1; }
    .sp-msg-btns-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="firebase-bootstrap.js"></script>
</body>

</html>
